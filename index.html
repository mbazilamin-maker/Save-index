<!doctype html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physics Tower Defense – SPM (Supabase)</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:12px}
.btn{border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;background:#334155}
.btn:disabled{opacity:.4}.btn.pri{background:#2563eb}.btn.red{background:#dc2626}.btn.grn{background:#16a34a}.btn.pur{background:#7c3aed}
input{background:#0f172a;border:1px solid #475569;border-radius:10px;padding:10px;width:100%}
svg{overflow:visible}
.btn{transition:transform .12s,filter .15s}.btn:active:not(:disabled){transform:scale(.93)}.btn:hover:not(:disabled){filter:brightness(1.15)}
.hp{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.basew{position:relative;padding:8px 0 2px}.basew svg{animation:bob 3s ease-in-out infinite}
.lvbadge{margin-top:4px;text-align:center;border-radius:999px;font-size:12px;font-weight:800;padding:3px 6px;color:#fff;text-shadow:0 1px 2px #0008}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes shake{10%,50%,90%{transform:translateX(-7px) rotate(-1.5deg)}30%,70%{transform:translateX(7px) rotate(1.5deg)}}
.hit{animation:shake .5s;filter:brightness(1.8) saturate(1.5)}.shk{animation:shake .45s}
@keyframes lvup{0%{transform:scale(.8);filter:brightness(2.5)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.lvup{animation:lvup .8s cubic-bezier(.3,1.5,.5,1)}
@keyframes heal{50%{filter:brightness(1.6) drop-shadow(0 0 12px #4ade80)}}.heal{animation:heal .8s}
@keyframes recoil{30%{transform:translateX(calc(var(--d)*-7px))}}.fire .cannon{animation:recoil .35s}
@keyframes pop{50%{transform:scale(1.35)}}.pop{animation:pop .4s}
@keyframes wave{to{transform:scaleX(.7) skewY(6deg)}}.flag{transform-box:fill-box;transform-origin:left center;animation:wave .9s ease-in-out infinite alternate}
@keyframes pulse{50%{opacity:.5}}.dome,.aura{animation:pulse 2s infinite}
@keyframes pin{from{transform:translateY(30px) scale(.92);opacity:0}}.mpop,.opt{animation:pin .35s cubic-bezier(.2,1.3,.4,1) backwards}
.ok{background:#16a34a!important;animation:pop .5s}.bad{background:#dc2626!important;animation:shake .45s}
@keyframes rise{to{transform:translate(-50%,-140px) scale(1.3);opacity:0}}
.ft{position:fixed;font-weight:800;font-size:22px;white-space:nowrap;text-shadow:0 2px 6px #000;pointer-events:none;transform:translate(-50%,-50%);animation:rise 1.1s ease-out forwards;z-index:50}
.pt{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:50}
.ball,.coin{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px;border-radius:50%;pointer-events:none;z-index:50}
.ball{background:radial-gradient(#fff,#f97316 55%,#dc2626);box-shadow:0 0 18px 8px #f97316aa}
.coin{background:radial-gradient(#fff,#facc15 60%,#ca8a04);box-shadow:0 0 14px 6px #facc15aa}
.ring{position:fixed;width:40px;height:40px;margin:-20px;border-radius:50%;border:4px solid;pointer-events:none;z-index:50}
.flash{position:fixed;inset:0;pointer-events:none;z-index:40}
.logrow{display:flex;gap:8px;align-items:center;background:#0f172a;border-radius:8px;padding:6px 8px}.logrow.new{box-shadow:inset 3px 0 #facc15;animation:pin .4s}</style></head>
<body class="min-h-screen"><div id="app" class="max-w-xl mx-auto p-3"></div><div id="modal"></div><div id="fx"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- Questions (KSSM Form 4 & 5) ---------- */
const Q=[
{id:'q1',t:'Daya dan Gerakan',l:1,q:'Antara kuantiti berikut, yang manakah kuantiti vektor?',o:['Laju','Jarak','Sesaran','Jisim'],a:2},
{id:'q2',t:'Daya dan Gerakan',l:1,q:'Sebuah kereta memecut daripada keadaan rehat kepada 20 m/s dalam masa 5 s. Berapakah pecutannya?',o:['2 m/s²','4 m/s²','10 m/s²','100 m/s²'],a:1},
{id:'q3',t:'Daya dan Gerakan',l:1,q:'Berapakah momentum objek berjisim 2 kg yang bergerak dengan halaju 3 m/s?',o:['1.5 kg m/s','5 kg m/s','6 kg m/s','9 kg m/s'],a:2},
{id:'q14',t:'Daya dan Gerakan',l:1,q:'Apakah unit S.I. bagi daya?',o:['Joule','Newton','Watt','Pascal'],a:1},
{id:'q4',t:'Graviti',l:1,q:'Jika jarak antara dua jisim digandakan, daya graviti antara kedua-duanya menjadi…',o:['Separuh','Suku','Dua kali ganda','Empat kali ganda'],a:1},
{id:'q5',t:'Haba',l:1,q:'Apakah unit S.I. bagi muatan haba tentu?',o:['J kg⁻¹ °C⁻¹','J °C⁻¹','W m⁻¹','J kg⁻¹'],a:0},
{id:'q6',t:'Gelombang',l:2,q:'Sebuah gelombang mempunyai frekuensi 50 Hz dan panjang gelombang 2 m. Berapakah lajunya?',o:['25 m/s','52 m/s','100 m/s','0.04 m/s'],a:2},
{id:'q15',t:'Gelombang',l:2,q:'Fenomena manakah menyebabkan gelombang melentur apabila melalui celah yang sempit?',o:['Pembiasan','Pantulan','Pembelauan','Interferens'],a:2},
{id:'q7',t:'Cahaya dan Optik',l:2,q:'Pantulan dalam penuh berlaku apabila cahaya bergerak daripada…',o:['Medium kurang tumpat ke medium lebih tumpat','Medium lebih tumpat ke medium kurang tumpat dengan sudut tuju lebih besar daripada sudut genting','Medium lebih tumpat ke medium kurang tumpat dengan sudut tuju lebih kecil daripada sudut genting','Udara ke vakum pada sudut tuju 0°'],a:1},
{id:'q8',t:'Elektrik',l:2,q:'Perintang 4 Ω disambungkan kepada bekalan 12 V. Berapakah arus yang mengalir?',o:['0.33 A','3 A','8 A','48 A'],a:1},
{id:'q9',t:'Keelektromagnetan',l:2,q:'Petua manakah menentukan arah daya ke atas konduktor berarus dalam medan magnet?',o:['Petua tangan kiri Fleming','Petua tangan kanan Fleming','Petua genggaman tangan kanan','Hukum Lenz'],a:0},
{id:'q10',t:'Keelektromagnetan',l:3,q:'Transformer injak naik mempunyai…',o:['Lebih banyak lilitan pada gegelung primer','Lebih banyak lilitan pada gegelung sekunder','Bilangan lilitan yang sama pada kedua-dua gegelung','Tiada teras besi'],a:1},
{id:'q11',t:'Elektronik',l:3,q:'Komponen manakah membenarkan arus mengalir dalam satu arah sahaja?',o:['Perintang','Kapasitor','Diod','Termistor'],a:2},
{id:'q12',t:'Fizik Moden',l:3,q:'Sinaran manakah mempunyai kuasa penembusan paling tinggi?',o:['Alfa','Beta','Gama','Semuanya sama'],a:2},
{id:'q16',t:'Fizik Moden',l:3,q:'Apakah yang dimaksudkan dengan separuh hayat?',o:['Masa untuk separuh bilangan nukleus radioaktif mereput','Masa untuk semua nukleus radioaktif mereput','Masa untuk aktiviti menjadi dua kali ganda','Masa untuk jisim bertambah separuh'],a:0},
{id:'q13',t:'Haba',l:3,q:'Hukum Boyle menyatakan bahawa bagi jisim gas tetap pada suhu malar…',o:['P berkadar terus dengan V','P berkadar songsang dengan V','P berkadar terus dengan T','V berkadar songsang dengan T'],a:1}
];

/* ---------- Backend adapter (localStorage demo; Supabase version below) ---------- */
const mem={};
const DB={get(k,d){try{const v=localStorage.getItem('ptd_'+k);return v?JSON.parse(v):(mem[k]??d)}catch(e){return mem[k]??d}},
 set(k,v){mem[k]=v;try{localStorage.setItem('ptd_'+k,JSON.stringify(v))}catch(e){}}};
const newTeam=()=>({hp:1000,atk:0,hpLv:0,base:0,shield:0});
const maxHp=t=>1000+150*t.hpLv;
// >>> PASTE YOUR SUPABASE ANON (public) KEY HERE: Project settings > API > anon public <<<
const SUPABASE_URL='https://tcquibpgpbuymzrkzbak.supabase.co',SUPABASE_KEY='ISI_ANON_KEY';
const CONFIGURED=SUPABASE_KEY!=='ISI_ANON_KEY';
const sb=CONFIGURED?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let gcache=null;
const email=u=>u.toLowerCase()+'@physicstd.local';
const toUser=r=>({username:r.username,team:r.team,score:r.score,ap:r.ap,level:r.level,streak:r.streak,solved:r.solved||[],lastSeen:Date.parse(r.last_seen)||Date.now()});
const authMsg=m=>/already|registered/i.test(m)?'Nama pengguna sudah wujud':/invalid login/i.test(m)?'Login gagal':m;
const freshGame=()=>({L:newTeam(),P:newTeam(),winner:null,log:[]});
const Backend={
 async profile(){const{data:{session}}=await sb.auth.getSession();if(!session)return null;
  const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();return data?toUser(data):null},
 async register(u,p,team){
  if(!/^[a-zA-Z0-9_]{3,20}$/.test(u))throw Error('Nama pengguna: 3-20 huruf/nombor/_');
  if(p.length<6)throw Error('Kata laluan minimum 6 aksara');
  const{data,error}=await sb.auth.signUp({email:email(u),password:p,options:{data:{username:u,team}}});
  if(error)throw Error(authMsg(error.message));
  if(!data.session)throw Error('Matikan "Confirm email" dalam Supabase (Authentication > Providers > Email)');
  return this.profile()},
 async login(u,p){const{error}=await sb.auth.signInWithPassword({email:email(u),password:p});if(error)throw Error(authMsg(error.message));return this.profile()},
 async session(){return CONFIGURED?this.profile():null},
 logout(){return sb.auth.signOut()},
 save(){if(sb)sb.rpc('touch')},
 game(){return gcache||freshGame()},
 async refresh(){
  const[a,b]=await Promise.all([sb.from('game_state').select('teams,winner').eq('id',1).single(),sb.from('game_log').select('*').order('id',{ascending:false}).limit(60)]);
  if(a.error)throw a.error;
  gcache={L:a.data.teams.L,P:a.data.teams.P,winner:a.data.winner,log:(b.data||[]).map(r=>({t:Date.parse(r.t),u:r.username,k:r.team,ty:r.ty,x:r.x}))};
  return gcache},
 subscribe(cb){setInterval(cb,1000);if(!CONFIGURED)return;
  const go=()=>this.refresh().then(cb).catch(e=>console.warn(e));
  sb.channel('game').on('postgres_changes',{event:'*',schema:'public',table:'game_state'},go).on('postgres_changes',{event:'*',schema:'public',table:'game_log'},go).subscribe();
  go();setInterval(go,15000)}
};

/* ---------- Game logic ---------- */
const NAME={L:'Team Lelaki',P:'Team Perempuan'},COL={L:'#3b82f6',P:'#ec4899'},TIER=['Pondok','Kubu','Istana','Kota Emas','Legenda'];
const foe=t=>t==='L'?'P':'L',shieldPct=t=>Math.min(.8,.5+.05*t.base),upCost=lv=>30+20*lv;
const lvl=t=>1+t.atk+t.hpLv+t.base,tier=t=>Math.min(4,Math.floor((lvl(t)-1)/2));
const COST={attack:10,repair:10,shield:20};
let me=null,authTab='login',msg='',busy=false,lastSig='',lastP={L:100,P:100},showAll=false,sinceTs=Infinity,savedAt=0,lastLogT=0;
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Audio (synthesised, no files) ---------- */
let AC,muted=DB.get('muted',false);
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,d,type='sine',v=.15,at=0,to){const c=ac();if(!c)return;const t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.3,f=1200,at=0){const c=ac();if(!c)return;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+at;s.buffer=b;fl.type='lowpass';fl.frequency.setValueAtTime(f,t);fl.frequency.exponentialRampToValueAtTime(80,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(t)}
const SND={
 tap:()=>tone(600,.05,'square',.04),
 ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.16,i*.08)),
 bad:()=>tone(220,.35,'sawtooth',.14,0,90),
 coin:()=>{tone(1200,.08,'square',.08);tone(1600,.14,'square',.08,.07)},
 err:()=>{tone(180,.12,'square',.1);tone(140,.18,'square',.1,.13)},
 fire:()=>{noise(.25,.25,2500);tone(500,.3,'sawtooth',.1,0,90)},
 boom:()=>{noise(.5,.5,900);tone(110,.4,'sine',.35,0,35)},
 heal:()=>[660,880,1100,1320].forEach((f,i)=>tone(f,.25,'sine',.12,i*.07)),
 shield:()=>{tone(300,.5,'sine',.15,0,900);tone(600,.5,'triangle',.08,.1,1400)},
 up:()=>[392,523,659,784,1047].forEach((f,i)=>tone(f,.22,'square',.09,i*.07)),
 win:()=>[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.18,i*.14)),
 notif:()=>{tone(880,.1,'sine',.08);tone(1100,.14,'sine',.08,.1)}
};
const snd=n=>{if(!muted&&SND[n])SND[n]()};
function toggleMute(){muted=!muted;DB.set('muted',muted);snd('tap');renderDash()}
addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))snd('tap')});

/* ---------- Activity log + auto-save ---------- */
const _save=Backend.save.bind(Backend);
Backend.save=x=>{x.lastSeen=Date.now();_save(x);savedAt=Date.now()};
addEventListener('pagehide',()=>{if(me)Backend.save(me)});
function logEv(g,ty,x){g.log=g.log||[];g.log.unshift({t:Date.now(),u:me.username,k:me.team,ty,x});g.log.length=Math.min(g.log.length,60)}
const ICON={attack:'⚔️',repair:'🔧',shield:'🛡',atk:'⬆️',hp:'⬆️',base:'⬆️',quiz:'📘',win:'🏆',reset:'🔄'};
const ago=t=>{const s=Math.max(0,Math.floor((Date.now()-t)/1000));return s<60?s+'s lalu':s<3600?Math.floor(s/60)+'m lalu':s<86400?Math.floor(s/3600)+'j lalu':Math.floor(s/86400)+'h lalu'};
const hm=t=>new Date(t).toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});
function logCard(g){
 const L=g.log||[],list=showAll?L:L.slice(0,8);
 return `<div class="card mt-2"><div class="flex justify-between items-center mb-2"><div class="font-semibold text-sm">📜 Aktiviti terkini</div><span class="text-xs text-slate-400">${L.length} rekod</span></div>
 ${L.length?`<div class="grid gap-1">${list.map(e=>`<div class="logrow ${e.t>sinceTs&&e.u!==me.username?'new':''}"><span>${ICON[e.ty]||'•'}</span><div class="flex-1 text-xs"><b style="color:${COL[e.k]}">${e.u}</b> <span class="text-slate-500">(${e.k==='L'?'Lelaki':'Perempuan'})</span> ${e.x}</div><span class="text-[10px] text-slate-400 whitespace-nowrap" data-t="${e.t}">${ago(e.t)}</span></div>`).join('')}</div>
 ${L.length>8?`<button class="btn text-xs w-full mt-2" onclick="showAll=!showAll;renderDash()">${showAll?'Tunjuk kurang':'Lihat semua'}</button>`:''}`:'<div class="text-xs text-slate-400">Belum ada aktiviti.</div>'}</div>`;
}

/* ---------- FX helpers ---------- */
const ctr=id=>{const r=$(id).getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};
function floatTxt(t,x,y,c){const e=document.createElement('div');e.className='ft';e.textContent=t;e.style.cssText=`left:${x}px;top:${y}px;color:${c}`;$('fx').appendChild(e);setTimeout(()=>e.remove(),1200)}
function burst(x,y,c,n=16){for(let i=0;i<n;i++){const p=document.createElement('i');p.className='pt';p.style.cssText=`left:${x}px;top:${y}px;background:${c}`;$('fx').appendChild(p);
 const a=Math.random()*6.28,d=40+Math.random()*60;p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`,opacity:0}],{duration:600+Math.random()*400,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove()}}
function ring(x,y,c){const e=document.createElement('div');e.className='ring';e.style.cssText=`left:${x}px;top:${y}px;border-color:${c}`;$('fx').appendChild(e);
 e.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(4.5)',opacity:0}],{duration:700,easing:'ease-out'}).onfinish=()=>e.remove()}
function fly(a,b,done,cls='ball',dur=700){const e=document.createElement('div');e.className=cls;$('fx').appendChild(e);
 const mx=(a.x+b.x)/2,my=Math.min(a.y,b.y)-90,tr=setInterval(()=>{const r=e.getBoundingClientRect();burst(r.left+11,r.top+11,cls==='ball'?'#fb923c':'#facc15',2)},40);
 e.animate([{transform:`translate(${a.x}px,${a.y}px) scale(.5)`},{transform:`translate(${mx}px,${my}px) scale(1.3)`,offset:.5},{transform:`translate(${b.x}px,${b.y}px) scale(.8)`}],{duration:dur,easing:'ease-in'}).onfinish=()=>{clearInterval(tr);e.remove();done()}}
function flash(c){const e=document.createElement('div');e.className='flash';e.style.background=c;$('fx').appendChild(e);e.animate([{opacity:.45},{opacity:0}],{duration:450}).onfinish=()=>e.remove()}
function confetti(){for(let i=0;i<8;i++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*.3,['#facc15','#4ade80','#38bdf8','#f472b6'][i%4],18),i*120)}
function cls(id,c,ms=900){const e=$(id);if(!e)return;e.classList.remove(c);void e.offsetWidth;e.classList.add(c);setTimeout(()=>e.classList.remove(c),ms)}
function bars(delay=0){setTimeout(()=>{for(const k of['L','P']){const el=$('hp-'+k);if(el){void el.offsetWidth;el.style.width=el.dataset.w+'%';lastP[k]=+el.dataset.w}}},delay)}

/* ---------- Actions ---------- */
async function act(kind){
 if(busy)return;
 const k=me.team,o=foe(k),g0=Backend.game(),mine0=g0[k];
 if(g0.winner)return;
 const key={atk:'atk',hp:'hpLv',base:'base'}[kind],cost=key?upCost(mine0[key]):COST[kind];
 if(me.ap<cost){msg='AP tidak cukup – jawab soalan untuk dapat AP.';snd('err');renderDash();const p=ctr('ap');floatTxt('AP tidak cukup!',p.x,p.y+30,'#f87171');return}
 busy=true;me.ap-=cost;
 let dmg=0,blocked=false,h=0,mine,opp,g;const t0=tier(mine0);
 try{const{data,error}=await sb.rpc('perform_action',{kind});if(error)throw error;
  dmg=data.dmg;blocked=data.blocked;h=data.h;me.ap=data.ap;g=await Backend.refresh();mine=g[k];opp=g[o];
  msg={attack:`Serangan! −${dmg} HP`,repair:`Pemulihan +${h} HP`,shield:'Perisai aktif 30s'}[kind]||'Naik taraf berjaya!'
 }catch(err){me.ap+=cost;busy=false;msg='Tindakan gagal – cuba lagi.';renderDash();return}
 lastLogT=g.log[0].t;
 renderDash(kind==='attack');cls('ap','pop');
 const a=ctr('base-'+k),b=ctr('base-'+o);
 if(kind==='attack'){
  snd('fire');cls('base-'+k,'fire',500);burst(a.x+(b.x>a.x?55:-55),a.y,'#fde047',12);
  const shots=1+Math.min(2,Math.floor(mine.atk/2));
  for(let i=0;i<shots;i++)setTimeout(()=>fly(a,{x:b.x,y:b.y+(i-(shots-1)/2)*16},()=>{snd('boom');burst(b.x,b.y,'#f97316',14);ring(b.x,b.y,'#f97316')}),i*180);
  await sleep(760+(shots-1)*180);
  bars(0);cls('base-'+o,'hit',600);flash('#ef4444');floatTxt(`−${dmg}`,b.x,b.y-30,'#f87171');
  if(blocked)floatTxt(`🛡 −${Math.round(shieldPct(opp)*100)}%`,b.x,b.y+10,'#7dd3fc');
  if(g.winner){confetti();snd('win')}
  await sleep(650);
 }
 if(kind==='repair'){snd('heal');cls('base-'+k,'heal');burst(a.x,a.y,'#4ade80',22);ring(a.x,a.y,'#4ade80');floatTxt(`+${h}`,a.x,a.y-30,'#4ade80');bars(0);await sleep(900)}
 if(kind==='shield'){snd('shield');ring(a.x,a.y,'#38bdf8');setTimeout(()=>ring(a.x,a.y,'#7dd3fc'),200);burst(a.x,a.y,'#38bdf8',20);floatTxt('🛡 Perisai!',a.x,a.y-30,'#7dd3fc');await sleep(900)}
 if(key){snd('up');cls('base-'+k,'lvup');ring(a.x,a.y,'#facc15');burst(a.x,a.y,'#facc15',26);flash('#facc1555');bars(0);
  floatTxt(`⬆ LEVEL ${lvl(mine)}!`,a.x,a.y-30,'#facc15');if(tier(mine)>t0)setTimeout(()=>floatTxt(`✨ ${TIER[tier(mine)]}!`,a.x,a.y+20,'#fde68a'),350);await sleep(1000)}
 busy=false;renderDash();
}
async function resetGame(){try{await sb.rpc('reset_game');await Backend.refresh();lastP={L:100,P:100};renderDash()}catch(e){}}

/* ---------- Question modal ---------- */
function askQ(){
 const pool=Q.filter(x=>x.l<=me.level),fresh=pool.filter(x=>!me.solved.includes(x.id));
 const src=fresh.length?fresh:pool,q=src[Math.floor(Math.random()*src.length)];
 const order=q.o.map((_,i)=>i).sort(()=>Math.random()-.5);
 window._q={q};
 modal.innerHTML=`<div class="fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center p-3 z-10"><div id="mbox" class="card w-full max-w-md mpop">
 <div class="text-xs text-sky-300 mb-1">${q.t} · Level ${q.l}</div><div class="font-semibold mb-3">${q.q}</div>
 <div id="opts" class="grid gap-2">${order.map((i,n)=>`<button class="btn text-left opt" style="animation-delay:${n*70}ms" data-i="${i}" onclick="ans(${i})">${q.o[i]}</button>`).join('')}</div>
 <div id="fb" class="mt-3 text-sm"></div></div></div>`;
}
async function ans(i){
 const {q}=window._q,bs=[...opts.querySelectorAll('button')],ch=bs.find(b=>+b.dataset.i===i),r=ch.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 bs.forEach(b=>b.style.pointerEvents='none');
 let d;try{const{data,error}=await sb.rpc('submit_answer',{qid:q.id,choice:i});if(error)throw error;d=data}catch(e){fb('Ralat sambungan – cuba lagi',false);return}
 bs.forEach(b=>{if(+b.dataset.i===d.answer)b.classList.add('ok')});
 const lv0=me.level;Object.assign(me,{ap:d.ap,score:d.score,level:d.level,streak:d.streak,solved:d.solved});
 if(d.ok){snd('ok');burst(x,y,'#4ade80',24);ring(x,y,'#4ade80');floatTxt(`+${d.gain} AP`,x,y-20,'#facc15');
  if(me.streak>=3)setTimeout(()=>floatTxt(`🔥 Streak x${me.streak}!`,x,y+30,'#fb923c'),250);
  if(me.level>lv0)setTimeout(()=>{snd('up');floatTxt(`🎓 Level ${me.level} dibuka!`,x,y-60,'#a78bfa')},500);
  fb(`✅ Betul! +${d.gain} AP`,true);renderDash();
  fly({x,y},ctr('ap'),()=>{cls('ap','pop');snd('coin')},'coin',650)}
 else{snd('bad');ch.classList.add('bad');cls('mbox','shk',450);flash('#ef444433');fb(`❌ Salah. Jawapan: ${q.o[d.answer]}`,false);renderDash()}
}
function fb(t,ok){$('fb').innerHTML=`<div class="${ok?'text-green-400':'text-red-400'} mb-2 font-semibold">${t}</div>
 <div class="flex gap-2"><button class="btn pri flex-1" onclick="askQ()">Soalan seterusnya</button><button class="btn flex-1" onclick="modal.innerHTML=''">Tutup</button></div>`}

/* ---------- Base visuals (design grows with levels) ---------- */
function baseSVG(t,c,dir){
 const sh=t.shield>Date.now(),T=tier(t),gold=T>=3?'#facc15':'#cbd5e1',roof=T>=3?'#facc15':'#475569';
 const sx=T>=1?(dir>0?126:14):(dir>0?112:28),len=8+4*Math.min(t.atk,5),bx=dir>0?sx:sx-len;
 let s=`<svg viewBox="-14 -14 168 114" class="w-full block" style="--d:${dir}"><ellipse cx="70" cy="92" rx="62" ry="7" fill="#000" opacity=".35"/>`;
 if(T>=4)s+=`<circle cx="70" cy="46" r="62" fill="${c}" opacity=".18" class="aura"/>`;
 s+=`<rect x="28" y="48" width="84" height="42" rx="3" fill="${c}"/><rect x="28" y="48" width="84" height="8" fill="#fff" opacity=".15"/>
 <path d="M28 62h84M28 76h84M49 56v6M70 62v14M91 56v6M49 76v14M91 76v14" stroke="#000" stroke-opacity=".25" fill="none"/>`;
 for(let i=0;i<6;i++)s+=`<rect x="${30+i*14}" y="42" width="8" height="7" fill="${c}"/>`;
 s+=`<path d="M60 90V74a10 10 0 0 1 20 0v16z" fill="#0f172a"/><path d="M60 82h20M70 64v26" stroke="#64748b"/>`;
 if(T>=1)for(const x of[14,106]){s+=`<rect x="${x}" y="30" width="20" height="60" rx="2" fill="${c}"/><rect x="${x}" y="30" width="20" height="6" fill="#fff" opacity=".18"/><rect x="${x+7}" y="48" width="6" height="12" rx="3" fill="#0f172a"/>`;
  for(let i=0;i<3;i++)s+=`<rect x="${x+1+i*7}" y="24" width="5" height="7" fill="${c}"/>`}
 if(T>=2)s+=`<rect x="54" y="18" width="32" height="32" fill="${c}"/><path d="M50 20L70 2L90 20z" fill="${roof}"/><rect x="66" y="28" width="8" height="12" rx="4" fill="#0f172a"/><path d="M70 2V-12" stroke="#cbd5e1" stroke-width="2"/><path class="flag" d="M70 -12h14l-4 5 4 5H70z" fill="${gold}"/>`;
 if(T>=3)for(const x of[14,106])s+=`<path d="M${x-2} 26L${x+10} 10L${x+22} 26z" fill="${roof}"/>`;
 if(T>=4)s+=`<circle cx="70" cy="-14" r="3.5" fill="#f472b6"/><path d="M60 50h20" stroke="#facc15" stroke-width="3"/>`;
 s+=`<g class="cannon"><rect x="${bx}" y="71" width="${len}" height="7" rx="2" fill="#94a3b8"/><circle cx="${dir>0?bx+len:bx}" cy="74.5" r="${t.atk?4.5:3.5}" fill="${t.atk?'#ef4444':'#64748b'}"/></g>`;
 for(let i=0;i<Math.min(t.hpLv,6);i++)s+=`<circle cx="${38+i*13}" cy="86" r="3" fill="#facc15" stroke="#a16207"/>`;
 if(sh)s+=`<ellipse cx="70" cy="46" rx="80" ry="58" fill="#38bdf8" fill-opacity=".15" stroke="#7dd3fc" stroke-width="2" class="dome"/>`;
 return s+'</svg>';
}
function teamCard(k,g){
 const t=g[k],p=t.hp/maxHp(t)*100,T=tier(t),sh=Math.ceil((t.shield-Date.now())/1000);
 return `<div id="card-${k}" class="card ${k===me.team?'ring-2 ring-white/40':''}" style="padding:8px">
 <div class="flex justify-between items-center"><span class="font-bold text-xs" style="color:${COL[k]}">${NAME[k]}${k===me.team?' ★':''}</span><span id="sh-${k}" class="text-xs text-sky-300">${sh>0?'🛡 '+sh+'s':''}</span></div>
 <div class="lvbadge" style="background:linear-gradient(90deg,${COL[k]},${T>=3?'#ca8a04':'#64748b'})">🏰 Lv ${lvl(t)} · ${TIER[T]}</div>
 <div class="flex justify-center gap-2 text-[11px] text-slate-300 mt-1"><span>⚔️${t.atk}</span><span>❤️${t.hpLv}</span><span>🏰${t.base}</span></div>
 <div id="base-${k}" class="basew">${baseSVG(t,COL[k],k==='L'?1:-1)}</div>
 <div class="h-3 bg-slate-700 rounded-full overflow-hidden mt-1"><div id="hp-${k}" class="hp h-full" data-w="${p}" style="width:${lastP[k]}%;background:${COL[k]}"></div></div>
 <div class="text-xs mt-1 text-center">${t.hp} / ${maxHp(t)} HP</div></div>`;
}
const sig=g=>{const n=Date.now();return JSON.stringify(g)+me.ap+msg+(g.L.shield>n)+(g.P.shield>n)};
function renderDash(defer){
 const g=Backend.game(),mine=g[me.team];lastSig=sig(g);const nNew=(g.log||[]).filter(e=>e.t>sinceTs&&e.u!==me.username).length;
 const ups=[['atk','⚔️ ATK',`Serangan ${40+15*mine.atk} → ${55+15*mine.atk}`,mine.atk],
  ['hp','❤️ Max HP',`${maxHp(mine)} → ${maxHp(mine)+150}`,mine.hpLv],
  ['base','🏰 Pangkalan',`Pulih +${50+25*mine.base} → +${75+25*mine.base}, perisai ${Math.round(shieldPct(mine)*100)}%+`,mine.base]];
 const b=(k,l,c,cl)=>`<button class="btn ${cl}" onclick="act('${k}')" ${me.ap<c||g.winner?'disabled':''}>${l}<br><span class="text-xs font-normal">${c} AP</span></button>`;
 app.innerHTML=`
 <div class="flex justify-between items-center mb-2"><div><div class="font-bold">${me.username}</div><div class="text-xs text-slate-400">${NAME[me.team]} · Level ${me.level} · Skor ${me.score}</div><div class="text-[10px] text-emerald-400">💾 Auto-simpan ${savedAt?hm(savedAt):'aktif'}</div></div>
 <div class="flex gap-1"><button class="btn text-xs" onclick="toggleMute()">${muted?'🔇':'🔊'}</button><button class="btn text-xs" onclick="Backend.save(me);Backend.logout();me=null;modal.innerHTML='';renderAuth()">Log keluar</button></div></div>
 ${nNew?`<div class="card mb-2 flex justify-between items-center text-sm" style="border-color:#facc15">📣 ${nNew} aktiviti baharu sejak anda keluar<button class="btn text-xs" onclick="sinceTs=Infinity;renderDash()">OK</button></div>`:''}
 ${g.winner?`<div class="card mb-2 text-center bg-yellow-900/40">🏆 ${NAME[g.winner]} menang! <button class="btn pri ml-2" onclick="resetGame()">Main semula</button></div>`:''}
 <div class="grid grid-cols-2 gap-2 mb-2">${teamCard('L',g)}${teamCard('P',g)}</div>
 <div class="card mb-2"><div class="flex justify-between items-center"><div class="text-lg font-bold">⚡ <span id="ap" class="inline-block">${me.ap}</span> AP <span class="text-xs text-slate-400">🔥${me.streak}</span></div>
 <button class="btn grn" onclick="askQ()">Jawab soalan (+AP)</button></div>
 <div class="text-xs text-amber-300 mt-1 min-h-[1rem]">${msg}</div></div>
 <div class="grid grid-cols-3 gap-2 mb-2">${b('attack','⚔️ Serang',COST.attack,'red')}${b('repair','🔧 Baiki',COST.repair,'grn')}${b('shield','🛡 Perisai',COST.shield,'pri')}</div>
 <div class="card"><div class="font-semibold text-sm mb-2">Naik taraf pasukan</div><div class="grid gap-2">
 ${ups.map(([k,n,d,lv])=>`<div class="flex items-center justify-between gap-2"><div><div class="text-sm">${n} <span class="text-slate-400">Lv${lv}</span></div><div class="text-xs text-slate-400">${d}</div></div>
 <button class="btn pur" onclick="act('${k}')" ${me.ap<upCost(lv)||g.winner?'disabled':''}>${upCost(lv)} AP</button></div>`).join('')}</div></div>${logCard(g)}`;
 if(!defer)bars(30);
}
function renderAuth(){
 app.innerHTML=`<div class="card mt-8"><h1 class="text-xl font-bold mb-1">⚛️ Physics Tower Defense</h1><p class="text-xs text-slate-400 mb-3">SPM Fizik Tingkatan 4 & 5 · Boys vs Girls</p>
 <div class="flex gap-2 mb-3"><button class="btn flex-1 ${authTab==='login'?'pri':''}" onclick="authTab='login';renderAuth()">Log masuk</button><button class="btn flex-1 ${authTab==='reg'?'pri':''}" onclick="authTab='reg';renderAuth()">Daftar</button></div>
 <div class="grid gap-2"><input id="u" placeholder="Nama pengguna" autocomplete="username"><input id="p" type="password" placeholder="Kata laluan">
 ${authTab==='reg'?`<select id="t" class="btn"><option value="L">Team Lelaki</option><option value="P">Team Perempuan</option></select>`:''}
 <button class="btn grn" onclick="doAuth()">${authTab==='reg'?'Daftar':'Masuk'}</button><div id="err" class="text-sm text-red-400"></div></div></div>`;
}
async function doAuth(){
 const btn=document.querySelector('#err').previousElementSibling;btn.disabled=true;
 try{const u=$('u').value.trim(),p=$('p').value;me=authTab==='reg'?await Backend.register(u,p,$('t').value):await Backend.login(u,p);boot()}
 catch(e){$('err').textContent=e.message;btn.disabled=false}
}
function boot(){if(!me)return renderAuth();if(CONFIGURED)Backend.refresh().then(()=>{lastLogT=(gcache.log[0]||{}).t||0;renderDash()}).catch(()=>{});sinceTs=me.lastSeen||Date.now();lastLogT=(Backend.game().log||[])[0]?.t||0;renderDash()}
function tick(){
 if(!me||busy)return;
  const g=Backend.game(),n=Date.now();
 const top=(g.log||[])[0];if(top&&top.t>lastLogT){if(top.u!==me.username)snd('notif');lastLogT=top.t}
 if(sig(g)!==lastSig&&!modal.innerHTML)return renderDash();
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=ago(+e.dataset.t));
 for(const k of['L','P']){const e=$('sh-'+k),s=Math.ceil((g[k].shield-n)/1000);if(e)e.textContent=s>0?'🛡 '+s+'s':''}
}
Backend.subscribe(tick);
async function start(){
 if(!CONFIGURED){app.innerHTML='<div class="card mt-8"><div class="font-bold mb-1">⚙️ Supabase belum disediakan</div><div class="text-sm text-slate-300">Buka fail ini dan isi <code>SUPABASE_KEY</code> (anon public key). Ikut langkah dalam README.md.</div></div>';return}
 app.innerHTML='<div class="card mt-8 text-center text-sm">Memuatkan…</div>';
 try{me=await Backend.session()}catch(e){me=null}
 boot();
}
start();
</script></body></html>
