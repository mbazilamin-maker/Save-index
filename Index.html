<style>

.flash{position:fixed;inset:0;pointer-events:none;z-index:40}
.logrow{display:flex;gap:8px;align-items:center;background:#0f172a;border-radius:8px;padding:6px 8px}.logrow.new{box-shadow:inset 3px 0 #facc15;animation:pin .4s}#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 35%,#1e3a8a 0%,#0f172a 60%,#020617 100%);overflow:hidden;display:flex;align-items:center;justify-content:center;transition:opacity .6s,transform .6s}

.i-wrap{position:relative;text-align:center;width:100%;max-width:520px;padding:16px}
.i-sub{font-size:12px;letter-spacing:.2em;color:#93c5fd;opacity:0;animation:fi .8s .1s forwards}

.i-title.i-2{font-size:clamp(24px,8vw,40px);background:linear-gradient(180deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text}
.i-title span{display:inline-block;opacity:0;animation:drop .6s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(1.6)}to{opacity:1;transform:none}}

@keyframes inl{from{transform:translateX(-140%)}}@keyframes inr{from{transform:translateX(140%)}}

.i-boom{position:absolute;right:14%;top:38%;width:40px;height:40px;border-radius:50%;border:4px solid #fb923c;opacity:0;animation:ib 2.4s 1.9s infinite}

.i-load{height:6px;background:#1e293b;border-radius:99px;overflow:hidden;margin:6px auto 12px;width:70%;animation:fo .4s 2.5s forwards}

@keyframes ld{to{width:100%}}@keyframes fo{to{opacity:0}}

@keyframes pul{50%{transform:scale(1.07);box-shadow:0 0 24px #7c3aedaa}}
#app{padding-bottom:116px!important}
#cv{position:fixed;inset:0;pointer-events:none;z-index:45}
.arena{position:relative;border-radius:16px;overflow:hidden;padding:8px 4px 8px;background:radial-gradient(ellipse at 50% 40%,#1d4d2b 0%,#10361f 55%,#0a2214 100%);border:1px solid #166534}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:4px;position:relative}

.smk{animation:smk 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes smk{from{opacity:.6;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-26px) scale(1.8)}}
.flm{animation:flm .35s infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes flm{to{transform:scale(.8,1.25)}}
.rebuild{animation:rebuild .9s cubic-bezier(.2,1.3,.4,1) backwards}@keyframes rebuild{from{transform:translateY(40px) scale(.5);opacity:0}}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#0f172af2;border-top:1px solid #334155}
.scol{border:2px solid;border-radius:12px;padding:6px;background:#0f172a}

function introInit(){
 const el=$('intro');if(!el)return;const T={hp:1000,atk:2,hpLv:2,base:2,shield:0};
 el.innerHTML=`<div class="i-stars" id="i-stars"></div><div class="i-wrap">
 <div class="i-sub">⚛️ SPM FIZIK · TINGKATAN 4 & 5</div><h1 class="i-title" id="i-t1">PHYSICS</h1><h2 class="i-title i-2" id="i-t2">TOWER DEFENSE</h2>
 <div class="i-arena"><div class="i-c l">${baseSVG(T,COL.L,1)}LELAKI</div><div class="i-vs">VS</div><div class="i-c r">${baseSVG(T,COL.P,-1)}PEREMPUAN</div><i class="i-fb"></i><i class="i-boom"></i></div>
 <div class="i-load"><i></i></div><button class="i-go">▶ TEKAN UNTUK MULA</button></div>`;
 [['i-t1',0],['i-t2',.5]].forEach(([id,d])=>{const e=$(id);e.innerHTML=[...e.textContent].map((c,n)=>`<span style="animation-delay:${.15+d+n*.06}s">${c===' '?'&nbsp;':c}</span>`).join('')});
 $('i-stars').innerHTML=Array.from({length:36},()=>`<s style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s"></s>`).join('')+['⚛','λ','Ω','∿','⚡','π','μ','Δ'].map((c,n)=>`<em style="left:${6+n*12}%;animation-delay:${n*.8}s">${c}</em>`).join('');
}
function introGo(){const el=$('intro');if(!el||el.classList.contains('out'))return;snd('up');el.classList.add('out');setTimeout(()=>el.remove(),700)}
introInit();
start();
</script></body></html>
